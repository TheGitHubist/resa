services:
  db:
    image: postgres:17-alpine
    container_name: resa-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in ../.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in ../.env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in ../.env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ../db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
  app:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: resa-app
    restart: always
    env_file:
      - ../.env
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    ports:
      - "${APP_PORT:-3000}:${PORT:-3000}"
    depends_on:
      - db